name: Source release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source archive
        run: |
          git archive --format=tar.gz --prefix=sitewarden-mail-${GITHUB_REF_NAME}/ \
            -o sitewarden-mail-${GITHUB_REF_NAME}.tar.gz HEAD
          sha256sum sitewarden-mail-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS.txt
      - name: Attest source archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sitewarden-mail-${{ github.ref_name }}.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sitewarden-mail-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt
