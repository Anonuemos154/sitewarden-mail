name: Windows Alpha Release

on:
  push:
    branches: [alpha-build]

permissions:
  contents: write

concurrency:
  group: windows-alpha-release
  cancel-in-progress: false

jobs:
  build-windows-alpha:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Privacy guard
        run: python scripts/privacy_guard.py

      - name: Build and publish Windows Alpha prerelease
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: alpha-latest
          releaseName: SiteWarden Mail — Windows Alpha
          releaseBody: |
            Alpha / Active Development.

            This build is intended for evaluation of the desktop interface and security architecture.
            Gmail, Microsoft Graph and generic IMAP provider connections are not production-ready yet.
            The Windows build may be unsigned until project code-signing is enabled.

            Download only from this official repository.
          releaseDraft: false
          prerelease: true
