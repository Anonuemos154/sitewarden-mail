[workspace]
resolver = "2"
exclude = ["apps/desktop/src-tauri"]
members = [
  "crates/domain",
  "crates/provider-api",
  "crates/risk-engine",
  "crates/safe-render",
  "crates/cleanup-engine",
  "crates/scanner-pipeline",
  "crates/storage-vault",
  "crates/url-guard",
  "crates/mime-guard",
  "crates/action-gateway",
  "crates/local-eml-provider",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
version = "0.1.0-alpha.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
sha2 = "0.10"
idna = "1"
mailparse = "0.17"
